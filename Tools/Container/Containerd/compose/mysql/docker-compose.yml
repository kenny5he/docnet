version: '3.3'
services:
  postgres:
    image: mysql:latest
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: dmt.123
    ports:
      - 3306:3306
    volumes:
      - "/home/containerd/mysql/warcraft/data:/var/lib/mysql"
      - "/home/containerd/mysql/warcraft/conf:/etc/mysql/conf.d"